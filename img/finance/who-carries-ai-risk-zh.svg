<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-label="兩頭都寫了退出門，中間先出錢的人沒有" font-size="12" font-family="-apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif">
<rect x="0" y="0" width="760" height="288" rx="12" fill="#FAFAF7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8A8A"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1F1F1F">兩頭都寫了退出門，中間先出錢的人沒有</text>
<g fill="none" stroke="#8A8A8A" stroke-width="1.25"><path d="M228 112H284" marker-end="url(#a)"/><path d="M488 112H544" marker-end="url(#a)"/><path d="M386 216V168" marker-end="url(#a)"/></g>
<text x="256" y="104" text-anchor="middle" font-size="11.5" fill="#6B6B6B">GPU</text>
<text x="516" y="104" text-anchor="middle" font-size="11.5" fill="#6B6B6B">算力</text>
<text x="398" y="196" font-size="11.5" fill="#6B6B6B">借款</text>
<rect x="24" y="56" width="204" height="112" rx="8" fill="none" stroke="#8A8A8A" stroke-width="1.25"/>
<text x="36" y="80" font-size="13" font-weight="600" fill="#1F1F1F">Nvidia（上游）</text>
<text x="36" y="102" fill="#1F1F1F">回租承諾：對方融資後先生效</text>
<text x="36" y="120" fill="#1F1F1F">擔保 1,180 億</text>
<text x="36" y="138" fill="#1F1F1F">供應承諾 3,900 億</text>
<text x="36" y="156" font-size="11.5" fill="#6B6B6B">對上游硬，對下游有條件</text>
<rect x="284" y="56" width="204" height="112" rx="8" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="2"/>
<text x="296" y="80" font-size="13" font-weight="600" fill="#1F1F1F">neocloud（中間）</text>
<text x="296" y="102" fill="#1F1F1F">借錢先買 GPU</text>
<text x="296" y="120" fill="#1F1F1F">上游承諾有條件</text>
<text x="296" y="138" fill="#1F1F1F">下游可以取消</text>
<text x="296" y="156" font-size="11.5" fill="#6B6B6B">債務與利息照付</text>
<rect x="544" y="56" width="204" height="112" rx="8" fill="none" stroke="#8A8A8A" stroke-width="1.25"/>
<text x="556" y="80" font-size="13" font-weight="600" fill="#1F1F1F">Anthropic（下游）</text>
<text x="556" y="102" fill="#1F1F1F">大雲端、自家晶片：</text>
<text x="556" y="120" fill="#1F1F1F">不論用量都要付</text>
<text x="556" y="138" fill="#1F1F1F">GPU 雲、neocloud：</text>
<text x="556" y="156" fill="#1F1F1F">可取消或到貨先付</text>
<rect x="284" y="216" width="204" height="48" rx="8" fill="none" stroke="#8A8A8A" stroke-width="1.25"/>
<text x="386" y="244" text-anchor="middle" fill="#1F1F1F">貸款人：銀行、私募信貸</text></svg>